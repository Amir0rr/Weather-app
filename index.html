<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="weather-app">
        <h1>Weather App</h1>
        <div class="search-box">
            <form id="form" class="form">
                <label for="city-name">City name :</label>
                <input type="text" id="city-name" class="city-name-input" placeholder="Enter a city" autocomplete="off"
                    required>
                <button type="submit" class="submit-btn">Search</button>
            </form>
        </div>
        <div class="result hidden">
            <h2 class="city-name"></h2>
            <p class="temp">Temperature : <span class="temp-number"></span> °C</p>
            <p class="weather-conditions"></p>
            <p class="wind-speed">Wind speed : <span class="wind-speed-number"></span> km/h</p>
        </div>
        <div class="messages">
            <p class="message" aria-live="polite"></p>
        </div>
    </div>
    <p class="open-meteo">Weather data by <a href="https://open-meteo.com/">open-meteo.com</a></p>

    <script src="script.js"></script>
</body>

</html>
